name: Atualizar Liturgia Diária CNBB

on:
  schedule:
    # Executa todos os dias às 03:00 (BRT) / 06:00 (UTC)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      parametro:
        description: 'Período a sincronizar (dias como "30", ano como "2027" ou data como "2027-04-18")'
        required: false
        default: '30'

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Atualizar Liturgia
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          PARAM="${{ github.event.inputs.parametro }}"
          if [ -z "$PARAM" ]; then PARAM="30"; fi
          python atualizar_liturgia.py "$PARAM"

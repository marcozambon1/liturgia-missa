name: Atualizar Liturgia Diária CNBB

on:
  schedule:
    # Executa todos os dias às 03:00 (BRT) / 06:00 (UTC)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite rodar manualmente pelo GitHub

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Atualizar Liturgia dos próximos 30 dias
        run: |
          python atualizar_liturgia.py 30
